<section class="custom-container">
  <div class="px-8 py-6 sm:px-28 sm:py-20 max-w-[722px] rounded-xl bg-white">
    <header>
      <img alt="" src="assets/imgs/Favicon-Interior.png" />
      <h1 class="text-[#161616] text-2xl sm:text-4xl font-bold mt-4 mb-8">
        {{ 'LOGIN_PAGE.LOGIN_LBL' | translate }}
      </h1>
    </header>
    @if (loginForm) {
      <article>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="flex flex-wrap gap-4 mb-4">
            <label
              class="relative flex flex-row-reverse items-center cursor-pointer gap-2 justify-between"
              for="static-radio-1"
            >
              بيانات النظام
              <div class="relative w-5 h-5">
                <input
                  type="radio"
                  id="static-radio-1"
                  name="radio"
                  checked
                  class="peer appearance-none h-5 w-5 cursor-pointer rounded-full border border-[var(--border-storm)] checked:border-[var(--border-forest)] transition-all"
                />
                <span
                  class="absolute bg-[#25935f] w-3 h-3 rounded-full opacity-0 peer-checked:opacity-100 transform top-[50%] left-[50%] -translate-y-1/2 -translate-x-1/2"
                >
                </span>
              </div>
            </label>
            <label
              class="relative flex flex-row-reverse items-center cursor-pointer gap-2 justify-between"
              for="static-radio-2"
            >
              بيانات Active Directory
              <div class="relative w-5 h-5">
                <input
                  type="radio"
                  id="static-radio-2"
                  name="radio"
                  class="peer appearance-none h-5 w-5 cursor-pointer rounded-full border border-[var(--border-storm)] checked:border-[var(--border-forest)] transition-all"
                />
                <span
                  class="absolute bg-[#25935f] w-3 h-3 rounded-full opacity-0 peer-checked:opacity-100 transform top-[50%] left-[50%] -translate-y-1/2 -translate-x-1/2"
                >
                </span>
              </div>
            </label>
          </div>
          <div>
            <div class="relative mb-6">
              <label for="userName" class="label">{{
                'LOGIN_PAGE.NATIONAL_ID_LBL' | translate
              }}</label>
              <input
                formControlName="username"
                id="userName"
                class="peer"
                type="text"
                pInputText
                [placeholder]="'LOGIN_PAGE.NATIONAL_ID_LBL' | translate"
                fluid="true"
              />
              <span
                class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-black transition-all duration-500 peer-focus:left-0 peer-focus:w-full"
              ></span>
            </div>
            <div class="relative mb-10">
              <label for="password" class="label">{{
                'LOGIN_PAGE.PASSWORD_LBL' | translate
              }}</label>
              <p-password
                formControlName="password"
                [toggleMask]="true"
                class="peer"
                id="password"
                type="password"
                [placeholder]="'LOGIN_PAGE.PASSWORD_LBL' | translate"
                fluid="true"
                [feedback]="false"
              />
              <span
                class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-black transition-all duration-500 peer-focus:left-0 peer-focus:w-full"
              ></span>
            </div>
          </div>
          <div>
            <div class="relative mb-6">
              <label for="userName" class="label"> اسم المستخدم </label>
              <input
                formControlName="username"
                id="userName"
                class="peer"
                type="text"
                pInputText
                placeholder="اسم المستخدم"
                fluid="true"
              />
              <span
                class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-black transition-all duration-500 peer-focus:left-0 peer-focus:w-full"
              ></span>
            </div>
            <div class="relative mb-10">
              <label for="password" class="label">{{
                'LOGIN_PAGE.PASSWORD_LBL' | translate
              }}</label>
              <p-password
                formControlName="password"
                [toggleMask]="true"
                class="peer"
                id="password"
                type="password"
                [placeholder]="'LOGIN_PAGE.PASSWORD_LBL' | translate"
                fluid="true"
                [feedback]="false"
              />
              <span
                class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-black transition-all duration-500 peer-focus:left-0 peer-focus:w-full"
              ></span>
            </div>
          </div>
          <div class="mt-10 flex items-center justify-between flex-wrap gap-4">
            <button type="submit" class="btn green-btn w-full">
              {{ 'LOGIN_PAGE.LOGIN_BTN' | translate }}
            </button>
            <button
              type="button"
              class="inline-flex items-center w-full justify-center min-h-[40px] px-3 rounded text-[14px] font-medium hover:bg-[#f1f1f1] transition"
              (click)="onForgotPassword()"
            >
              {{ 'RESET_PASSWORD.FORGOT_PASSWORD' | translate }}
            </button>
          </div>
        </form>
      </article>
    }
  </div>
</section>
