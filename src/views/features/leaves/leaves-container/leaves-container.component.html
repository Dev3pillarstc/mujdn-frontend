<div class="bg-white">
    <div class="bg-[#f9fafb] p-3 sm:p-6">
        <!-- Header -->
        <div class="header bg-white rounded-2xl p-4 sm:p-6 mb-6">
            <p-breadcrumb class="max-w-full" [model]="items" [home]="home" />
            <h3 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#161616]">طلبات الاجازات</h3>
        </div>

        <!-- Tabs -->
        <p-tabs [(value)]="activeTabIndex">
            <p-tablist class="my-6">
                <p-tab [value]="0">سجل طلباتي</p-tab>
                <p-tab [value]="1">طلبات الاجازة للموظفين التابعين</p-tab>
            </p-tablist>

            <p-tabpanels>
                <!-- My leaves requests -->
                <p-tabpanel [value]="0">
                    <app-my-leaves></app-my-leaves>
                </p-tabpanel>

                <!-- Subordinates leaves requests -->
                <p-tabpanel [value]="1">
                    <app-other-leaves></app-other-leaves>
                </p-tabpanel>
            </p-tabpanels>
        </p-tabs>
    </div>
</div>
