<div class="bg-white">
  <div class="bg-[#f9fafb] p-3 sm:p-6">
    <div class="header bg-white rounded-2xl p-4 sm:p-6 mb-6">
      <p-breadcrumb [home]="home" [model]="breadcrumbs" class="max-w-full">
        <ng-template let-item pTemplate="item">
          <a [routerLink]="item.routerLink" class="cursor-pointer">
            <span>{{ item.label | translate }}</span>
          </a>
        </ng-template>
      </p-breadcrumb>
      <h3 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#161616]">
        {{ 'USER_WORK_SHIFT_PAGE.WORK_SHIFT_ASSIGNMENT' | translate }}
      </h3>
    </div>

    <p-tabs [(value)]="activeTabIndex" (valueChange)="onTabChange($event)">
      <p-tablist class="my-6">
        <p-tab [value]="0" (click)="clickMyShiftsTab()">
          {{ 'MY_SHIFTS.MY_SHIFTS' | translate }}
        </p-tab>
        @if (showAssignmentsTab()) {
          <p-tab [value]="1">
            {{ 'USER_WORK_SHIFT_PAGE.WORK_SHIFT_ASSIGNMENT_TAB' | translate }}
          </p-tab>
        }
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel [value]="0">
          <app-my-shifts [embedded]="true" />
        </p-tabpanel>
        @if (showAssignmentsTab()) {
          <p-tabpanel [value]="1">
            <app-work-shifts-assignment [embedded]="true" />
          </p-tabpanel>
        }
      </p-tabpanels>
    </p-tabs>
  </div>
</div>
