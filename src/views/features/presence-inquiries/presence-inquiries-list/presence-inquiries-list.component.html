<div class="bg-white">
  <div class="bg-[#f9fafb] p-3 sm:p-6">
    <div class="header bg-white rounded-2xl p-4 sm:p-6 mb-6">
      <p-breadcrumb class="max-w-full" [model]="breadcrumbs" [home]="home" />
      <h3 class="text-xl sm:text-2xl md:text-3xl font-bold text-[#161616]">
        {{ 'INQUIRIES_PAGE.PRESENCE_INQUIRIES' | translate }}
      </h3>
    </div>

    <p-tabs [(value)]="activeTabIndex" (valueChange)="onTabChange($event)">
      <p-tablist class="my-6">
        <p-tab [value]="0">
          {{ 'INQUIRIES_PAGE.MY_INQUIRIES' | translate }}
        </p-tab>
        @if (showOthersInquiries()) {
          <p-tab [value]="1">
            {{ 'INQUIRIES_PAGE.OTHERS_INQUIRIES' | translate }}
          </p-tab>
        }
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel [value]="0">
          <app-my-presence-inquiries-list #myList></app-my-presence-inquiries-list>
        </p-tabpanel>
        <p-tabpanel [value]="1">
          <app-others-presence-inquiries-list #othersList></app-others-presence-inquiries-list>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</div>
