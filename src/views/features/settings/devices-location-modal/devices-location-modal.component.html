<div dir="rtl">
  <div class="p-6">
    <button (click)="close()" class="block ms-auto">
      <i class="pi pi-times close-popup"></i>
    </button>
    <h3 class="text-[#1f2a37 font-[600] mb-4 text-lg sm:text-xl">
      {{ 'LOCATION.ADD_NEW' | translate }}
    </h3>
    <form [formGroup]="form" class="mt-6">
      <div class="grid grid-cols-1">
        <div class="xl:col-span-1">
          <label class="label" for="locationAr">{{ 'LOCATION.AR' | translate }}</label>
          <div class="relative">
            <input
              class="peer"
              fluid="true"
              id="locationAr"
              formControlName="nameAr"
              pInputText
              placeholder="اسم الموقع بالعربية"
              type="text"
            />
            <span
              class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-black transition-all duration-500 peer-focus-within:left-0 peer-focus-within:w-full"
            ></span>
          </div>
          <app-validation-messages [control]="nameArControl"></app-validation-messages>
        </div>
        <div class="xl:col-span-1">
          <label class="label" for="locationEn">{{ 'LOCATION.EN' | translate }}</label>
          <div class="relative">
            <input
              class="peer"
              fluid="true"
              id="locationEn"
              formControlName="nameEn"
              pInputText
              placeholder="اسم الموقع بالانجليزية"
              type="text"
            />
            <span
              class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-black transition-all duration-500 peer-focus-within:left-0 peer-focus-within:w-full"
            ></span>
          </div>
          <app-validation-messages [control]="nameEnControl"></app-validation-messages>
        </div>
      </div>
      <div class="actions mt-6 flex items-center justify-end gap-4">
        <button type="button" (click)="close()" class="btn gray-btn">
          {{ 'COMMON.CANCEL' | translate }}
        </button>
        <button type="button" (click)="save$.next()" class="btn green-btn">
          {{ 'COMMON.SAVE' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
